
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install tools
        run: |
          pip install buildozer cython==0.29.33
          sudo apt install -y zip unzip
      - name: Accept licenses
        run: |
          mkdir -p ~/.android/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p $ANDROID_HOME/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1059b8ea6b9d\n" > ~/.android/licenses/android-sdk-license
          cp ~/.android/licenses/android-sdk-license $ANDROID_HOME/licenses/
          cp ~/.android/licenses/android-sdk-license ~/.buildozer/android/platform/android-sdk/licenses/
          yes | sdkmanager --licenses || true
      - name: Install SDK
        run: |
          sdkmanager "build-tools;33.0.1" "build-tools;37.0.0" "platforms;android-33"
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools
          cp -r $ANDROID_HOME/build-tools/33.0.1 ~/.buildozer/android/platform/android-sdk/build-tools/ 2>/dev/null || true
          cp -r $ANDROID_HOME/build-tools/37.0.0 ~/.buildozer/android/platform/android-sdk/build-tools/ 2>/dev/null || true
      - name: Build APK
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera-APK
          path: bin/*.apk

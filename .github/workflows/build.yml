name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Build
        run: |
          pip install buildozer cython==0.29.33
          export SDK=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          mkdir -p ~/.android/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea6b9d" >> ~/.android/licenses/android-sdk-license
          cp ~/.android/licenses/android-sdk-license ~/.buildozer/android/platform/android-sdk/licenses/ || true
          cp ~/.android/licenses/android-sdk-license $ANDROID_HOME/licenses/ || true
          yes | $SDK --licenses || true
          $SDK "build-tools;33.0.1" "platforms;android-33" || true
          buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Camera-APK
          path: bin/*.apk

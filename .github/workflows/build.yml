
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Build
        run: |
          pip install buildozer cython==0.29.33
          sudo apt install -y zip unzip
          SDK=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf $SDK ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          mkdir -p ~/.android/licenses $ANDROID_HOME/licenses
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1059b8ea6b9d" > ~/.android/licenses/android-sdk-license
          cp ~/.android/licenses/android-sdk-license $ANDROID_HOME/licenses/
          cp ~/.android/licenses/android-sdk-license ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || mkdir -p ~/.buildozer/android/platform/android-sdk/licenses && cp ~/.android/licenses/android-sdk-license ~/.buildozer/android/platform/android-sdk/licenses/
          yes | $SDK --licenses || true
          buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Camera-APK
          path: bin/*.apk

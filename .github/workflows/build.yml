
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Build
        run: |
          pip install buildozer cython==0.29.33
          sudo apt-get update
          sudo apt-get install -y zip unzip
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p ~/.buildozer/android/platform/android-sdk
          ln -sfn "$ANDROID_HOME" ~/.buildozer/android/platform/android-sdk
          mkdir -p $HOME/.android/licenses $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea6b9d" >> $HOME/.android/licenses/android-sdk-license
          cp $HOME/.android/licenses/* $ANDROID_HOME/licenses/ || true
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.1"
          buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Camera-APK
          path: bin/*.apk

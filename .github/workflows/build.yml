
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git zip unzip openjdk-17-jdk libffi-dev libssl-dev
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer

      - name: Accept Android Licenses & Build
        run: |
          yes | buildozer android debug || true
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          if [ -d "$SDK_DIR/cmdline-tools" ]; then
            yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $SDK_DIR/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platforms;android-33" || true
          fi
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel11-Camera-APK
          path: bin/*.apk
